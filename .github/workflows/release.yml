name: Release

# Runs on every push to main. The version comes from package.json; if a GitHub
# Release for vX.Y.Z already exists the run is a no-op, otherwise it builds the
# .sppkg and creates the vX.Y.Z tag + Release — so no manual tagging is needed.
# Also runnable by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      needed: ${{ steps.ver.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether a release is needed
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Verify package.json matches package-solution.json version
        run: |
          TAG_VERSION="$VERSION.0"
          PKG_VERSION=$(node -p "require('./config/package-solution.json').solution.version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "package.json $VERSION expects solution.version $TAG_VERSION but config/package-solution.json has $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install gulp-cli
        run: npm install -g gulp-cli

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and package
        run: npm run ship

      - name: Extract this version's CHANGELOG section
        run: |
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1      { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                    { print }
          ' CHANGELOG.md > changelog-section.md
          sed -i -e 's/^---$//' changelog-section.md
          if [ ! -s changelog-section.md ] || ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "No CHANGELOG.md section found for [$VERSION]" >&2
            exit 1
          fi

      - name: Build release notes
        run: |
          {
            echo "## Installation"
            echo ""
            echo "1. Download \`sharepoint-smart-forms.sppkg\`"
            echo "2. Upload to your SharePoint App Catalog"
            echo "3. Deploy tenant-wide or to specific sites"
            echo ""
          } > release-notes.md
          cat changelog-section.md >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sharepoint/solution/sharepoint-smart-forms.sppkg
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: release-notes.md
